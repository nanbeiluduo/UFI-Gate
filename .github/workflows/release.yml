name: Publish release

on:
  # 只通过网页手动触发：填版本号，workflow 自己打 tag、push tag、再发版。
  # 不再监听 push.tags，避免本 workflow push tag 后又把自己触发一次。
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，例如 1.2.0（可带可不带 v/V 前缀）'
        required: true
        type: string
      branch:
        description: '从哪个分支切版（默认 main）'
        required: false
        type: string
        default: main

permissions:
  contents: write # 用于 push tag 和创建 release

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.2'
          cache: false

      - name: Derive and verify version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BRANCH: ${{ inputs.branch || 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$INPUT_VERSION"
          version="$(echo "$raw" | sed -E 's/^[vV]//')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号必须是 X.Y.Z，got '$raw'"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ ! -f "docs/releases/${tag}.md" ]]; then
            echo "::error::缺少发布说明 docs/releases/${tag}.md，请先补上再发版"
            exit 1
          fi
          echo "Releasing $tag from branch $INPUT_BRANCH"

      - name: Fail early if tag or release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG 已经存在于远程，拒绝重复发布"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已经存在，拒绝重复发布"
            exit 1
          fi

      - name: Tests and checks
        run: |
          go test -mod=vendor -race ./...
          go vet -mod=vendor ./...
          node --check web/admin.js
          node --check web/admin-updates.js
          node --check web/admin-access.js
          node --check web/recovery.js
          node --check web/portal.js
          sh -n service.sh
          sh -n emergency-recover.sh

      - name: Build release attachments
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 build.py --out dist --version "$RELEASE_VERSION" --require-signature
          node --check "dist/UFI-Gate-${{ steps.ver.outputs.version }}-arm32.js"
          node --check "dist/UFI-Gate-${{ steps.ver.outputs.version }}-arm64.js"
          node tests/installer-test.cjs dist
          python3 scripts/package_release.py --out dist

      - name: Browser regression checks
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          go build -mod=vendor -buildvcs=false -o ufi-gate-demo .
          node tests/update-ui-test.cjs
          node tests/management-ui-test.cjs
          node tests/remote-approval-ui-test.cjs
          node tests/network-ui-test.cjs

      - name: Execute ARM32 and ARM64 tests under QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7,softfloat go test -mod=vendor -c -o dist/tests-arm32 .
          qemu-arm dist/tests-arm32 -test.v
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go test -mod=vendor -c -o dist/tests-arm64 .
          qemu-aarch64 dist/tests-arm64 -test.v
          qemu-arm dist/ufi-gate-arm32 -h
          qemu-aarch64 dist/ufi-gate-arm64 -h

      - name: Update README and version constant for release
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 scripts/update_readme.py "$RELEASE_VERSION"
          sed -i 's|const version = "[^"]*"|const version = "'"$RELEASE_VERSION"'"|' main.go
          git diff --stat README.md main.go || true

      - name: Commit and push README back to branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md main.go
          branch="${{ inputs.branch || 'main' }}"
          if git diff --cached --quiet; then
            echo "README and version already up to date"
          else
            git commit -m "chore: bump version to ${{ steps.ver.outputs.tag }} and update README"
            git push origin "HEAD:${branch}"
          fi

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Publish release (draft -> upload -> publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="$RELEASE_VERSION"
          gh release create "$tag" \
            --verify-tag \
            --title "UFI-Gate $tag" \
            --notes-file "docs/releases/${tag}.md" \
            --draft
          gh release upload "$tag" \
            "dist/UFI-Gate-${version}-arm32.js" \
            "dist/UFI-Gate-${version}-arm64.js" \
            "dist/UFI-Gate-${version}-source.zip" \
            "dist/UFI-Gate-${version}-arm32-update.tar.gz" \
            "dist/UFI-Gate-${version}-arm64-update.tar.gz" \
            dist/update.json dist/update.json.sig \
            dist/build-info.json \
            dist/SHA256SUMS
          # 发布维护版旧 tag 时不能把 latest 往回拉。
          previous=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          latest=$(python3 - "$version" "$previous" <<'PY'
          import re, sys
          parse = lambda v: tuple(map(int, v.lstrip('v').split('.')))
          old = sys.argv[2]
          print('true' if not re.fullmatch(r'v?\d+\.\d+\.\d+', old) or parse(sys.argv[1]) > parse(old) else 'false')
          PY
          )
          gh release edit "$tag" --draft=false --latest="$latest"
