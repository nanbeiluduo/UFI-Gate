name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.4)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.2'
          cache: false

      - name: Derive and verify version from tag
        id: ver
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like vX.Y.Z, got '$tag'"
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ ! -f "docs/releases/${tag}.md" ]]; then
            echo "::error::Missing release notes docs/releases/${tag}.md"
            exit 1
          fi
          echo "Releasing $tag; build.py embeds the tag version."

      - name: Tests and checks
        run: |
          go test -mod=vendor -race ./...
          go vet -mod=vendor ./...
          node --check web/admin.js
          node --check web/admin-updates.js
          node --check web/portal.js
          sh -n service.sh
          sh -n emergency-recover.sh

      - name: Build release attachments
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 build.py --out dist --version "$RELEASE_VERSION" --require-signature
          node --check "dist/UFI-Gate-${{ steps.ver.outputs.version }}-arm32.js"
          node --check "dist/UFI-Gate-${{ steps.ver.outputs.version }}-arm64.js"
          node tests/installer-test.cjs dist
          python3 scripts/package_release.py --out dist

      - name: Browser regression checks
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          go build -mod=vendor -buildvcs=false -o ufi-gate-demo .
          node tests/update-ui-test.cjs
          node tests/management-ui-test.cjs

      - name: Execute ARM32 and ARM64 tests under QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7,softfloat go test -mod=vendor -c -o dist/tests-arm32 .
          qemu-arm dist/tests-arm32 -test.v
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go test -mod=vendor -c -o dist/tests-arm64 .
          qemu-aarch64 dist/tests-arm64 -test.v
          qemu-arm dist/ufi-gate-arm32 -h
          qemu-aarch64 dist/ufi-gate-arm64 -h

      - name: Publish release (draft -> upload -> publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Refusing to overwrite it."
            exit 1
          fi
          gh release create "$tag" \
            --verify-tag \
            --title "UFI-Gate $tag" \
            --notes-file "docs/releases/${tag}.md" \
            --draft
          gh release upload "$tag" \
            "dist/UFI-Gate-${version}-arm32.js" \
            "dist/UFI-Gate-${version}-arm64.js" \
            "dist/UFI-Gate-${version}-source.zip" \
            "dist/UFI-Gate-${version}-arm32-update.tar.gz" \
            "dist/UFI-Gate-${version}-arm64-update.tar.gz" \
            dist/update.json dist/update.json.sig \
            dist/build-info.json \
            dist/SHA256SUMS
          # Publishing an older maintenance tag must not move latest backwards.
          previous=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          latest=$(python3 - "$version" "$previous" <<'PY'
          import re, sys
          parse = lambda v: tuple(map(int, v.lstrip('v').split('.')))
          old = sys.argv[2]
          print('true' if not re.fullmatch(r'v?\d+\.\d+\.\d+', old) or parse(sys.argv[1]) > parse(old) else 'false')
          PY
          )
          gh release edit "$tag" --draft=false --latest="$latest"
