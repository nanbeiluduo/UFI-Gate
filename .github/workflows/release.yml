name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.4)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.2'
          cache: false

      - name: Derive and verify version from tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like vX.Y.Z, got '$tag'"
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ ! -f "docs/releases/${tag}.md" ]]; then
            echo "::error::Missing release notes docs/releases/${tag}.md"
            exit 1
          fi
          # Auto-align main.go const version with the tag (tag is the source of truth).
          sed -i -E 's/const version = "[^"]+"/const version = "'"$version"'"/' main.go
          grep -q "const version = \"$version\"" main.go || { echo "::error::Failed to bump main.go"; exit 1; }
          echo "Releasing $tag (version=$version); main.go aligned."

      - name: Tests and checks
        run: |
          go test -mod=vendor -race ./...
          go vet -mod=vendor ./...
          node --check web/admin.js
          node --check web/portal.js
          sh -n service.sh
          sh -n emergency-recover.sh

      - name: Build release attachments
        run: |
          python3 build.py --out dist --version "${{ steps.ver.outputs.version }}"
          node --check "dist/UFI-Gate-${{ steps.ver.outputs.version }}-arm32.js"
          node --check "dist/UFI-Gate-${{ steps.ver.outputs.version }}-arm64.js"
          node tests/installer-test.cjs dist
          python3 scripts/package_release.py --out dist

      - name: Execute ARM32 and ARM64 tests under QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7,softfloat go test -mod=vendor -c -o dist/tests-arm32 .
          qemu-arm dist/tests-arm32 -test.v
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go test -mod=vendor -c -o dist/tests-arm64 .
          qemu-aarch64 dist/tests-arm64 -test.v
          qemu-arm dist/ufi-gate-arm32 -h
          qemu-aarch64 dist/ufi-gate-arm64 -h

      - name: Publish release (draft -> upload -> publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          version="${{ steps.ver.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Refusing to overwrite it."
            exit 1
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "UFI-Gate $tag" \
            --notes-file "docs/releases/${tag}.md" \
            --draft
          gh release upload "$tag" \
            "dist/UFI-Gate-${version}-arm32.js" \
            "dist/UFI-Gate-${version}-arm64.js" \
            "dist/UFI-Gate-${version}-source.zip" \
            dist/build-info.json \
            dist/SHA256SUMS
          gh release edit "$tag" --draft=false --latest

      - name: Sync README version references and commit back to main
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          version="${{ steps.ver.outputs.version }}"
          python3 - <<'PY'
          import re, pathlib, sys
          tag = "${{ steps.ver.outputs.tag }}"
          version = "${{ steps.ver.outputs.version }}"
          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8")

          # 1. 当前版本：`old` -> `new`
          text, n1 = re.subn(r'(当前版本：`)[^`]+(`)', rf'\g<1>{version}\g<2>', text, count=1)
          # 2. 下载表格里的 UFI-Gate-old-armXX.js -> UFI-Gate-new-armXX.js
          text, n2 = re.subn(r'UFI-Gate-\d+\.\d+\.\d+-(arm32|arm64)\.js', rf'UFI-Gate-{version}-\1.js', text)
          # 3. 版本记录表：在 | --- | 分隔行后插入新行（取 release notes 第一段作为描述）
          notes = pathlib.Path(f"docs/releases/{tag}.md").read_text(encoding="utf-8").splitlines()
          summary = next((ln.strip() for ln in notes if ln.strip() and not ln.startswith('#')), "")
          summary = summary.rstrip('。')
          if f"| `{version}` |" not in text:
              row = f"| `{version}` | {summary}。[详情](docs/releases/{tag}.md) |\n"
              text, n3 = re.subn(r'(\| --- \|\n)', r'\1' + row, text, count=1)
          else:
              text, n3 = text, 1

          readme.write_text(text, encoding="utf-8", newline="\n")
          print(f"replaced: current_version={n1} download_links={n2} added_row={n3}")
          if n1 == 0 or n3 == 0:
              sys.exit("README sync pattern not matched; inspect README manually")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md main.go
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync version to $tag (main.go + README) [skip ci]"
            git push
          fi
