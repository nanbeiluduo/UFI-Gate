name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.4)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.2'
          cache: false

      - name: Derive and verify version from tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like vX.Y.Z, got '$tag'"
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Refuse to build if main.go version does not match the tag.
          if ! grep -q "const version = \"$version\"" main.go; then
            echo "::error::main.go version does not match tag $tag. Bump const version first."
            exit 1
          fi
          if [[ ! -f "docs/releases/${tag}.md" ]]; then
            echo "::error::Missing release notes docs/releases/${tag}.md"
            exit 1
          fi
          echo "Releasing $tag (version=$version)"

      - name: Tests and checks
        run: |
          go test -mod=vendor -race ./...
          go vet -mod=vendor ./...
          node --check web/admin.js
          node --check web/portal.js
          sh -n service.sh
          sh -n emergency-recover.sh

      - name: Build release attachments
        run: |
          python3 build.py --out dist
          node --check "dist/UFI-Gate-${{ steps.ver.outputs.version }}-arm32.js"
          node --check "dist/UFI-Gate-${{ steps.ver.outputs.version }}-arm64.js"
          node tests/installer-test.cjs dist
          python3 scripts/package_release.py --out dist

      - name: Execute ARM32 and ARM64 tests under QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7,softfloat go test -mod=vendor -c -o dist/tests-arm32 .
          qemu-arm dist/tests-arm32 -test.v
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go test -mod=vendor -c -o dist/tests-arm64 .
          qemu-aarch64 dist/tests-arm64 -test.v
          qemu-arm dist/ufi-gate-arm32 -h
          qemu-aarch64 dist/ufi-gate-arm64 -h

      - name: Publish release (draft -> upload -> publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          version="${{ steps.ver.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Refusing to overwrite it."
            exit 1
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "UFI-Gate $tag" \
            --notes-file "docs/releases/${tag}.md" \
            --prerelease --draft
          gh release upload "$tag" \
            "dist/UFI-Gate-${version}-arm32.js" \
            "dist/UFI-Gate-${version}-arm64.js" \
            "dist/UFI-Gate-${version}-source.zip" \
            dist/build-info.json \
            dist/SHA256SUMS
          gh release edit "$tag" --draft=false --prerelease
