name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.2'
          cache: false
      - name: Tests and race detector
        run: go test -mod=vendor -race ./...
      - name: Static checks
        run: |
          go vet -mod=vendor ./...
          node --check web/admin.js
          node --check web/admin-updates.js
          node --check web/admin-access.js
          node --check web/recovery.js
          node --check web/portal.js
          node --check tests/ui-test.cjs
          sh -n service.sh
          sh -n emergency-recover.sh
      - name: Build and verify ARM32 and ARM64 plugins
        run: |
          # Ephemeral CI signing key. Production releases use the repository secret.
          export UPDATE_SIGNING_KEY=$(python3 -c "import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())")
          python3 build.py --out dist --require-signature
          for f in dist/UFI-Gate-*-arm32.js dist/UFI-Gate-*-arm64.js; do node --check "$f"; done
          node tests/installer-test.cjs dist
          python3 scripts/package_release.py --out dist
      - name: Browser regression checks
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          go build -mod=vendor -buildvcs=false -o ufi-gate-demo .
          node tests/update-ui-test.cjs
          node tests/management-ui-test.cjs
          node tests/recovery-ui-test.cjs

      - name: Execute ARM32 and ARM64 tests under QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7,softfloat go test -mod=vendor -c -o dist/tests-arm32 .
          qemu-arm dist/tests-arm32 -test.v
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go test -mod=vendor -c -o dist/tests-arm64 .
          qemu-aarch64 dist/tests-arm64 -test.v
          qemu-arm dist/ufi-gate-arm32 -h
          qemu-aarch64 dist/ufi-gate-arm64 -h
