<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员登录 · UFI-Gate</title><link rel="icon" href="/site-logo"><link rel="stylesheet" href="/style.css"><script defer src="/recovery.js"></script><script defer src="/admin-access.js"></script></head>
<body><div id="root"><main class="auth-shell"><section class="card auth-card"><div class="logo custom-logo"><img src="/site-logo" alt="网站 Logo"></div><div class="badge">UFI-GATE · ADMINISTRATION</div><h1>管理员登录</h1><p class="muted">使用管理员账号验证后，此设备将获得 UFI-Gate 与宿主后台的管理访问权限，不改变设备联网授权和配额。</p><form id="admin-access-form"><div class="checks"><label><input id="forgot-password" type="checkbox">忘记密码，使用恢复密钥</label></div><div id="password-fields"><label>管理员账号<input id="admin-user" autocomplete="username" maxlength="64" required></label><label>管理员密码<input id="admin-password" type="password" autocomplete="current-password" maxlength="128" required></label></div><div id="recovery-fields" hidden><label>恢复密钥<input id="admin-recovery-key" type="password" autocomplete="off" maxlength="128" disabled></label><label>新管理员密码<input id="admin-new-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" disabled></label><label>确认新密码<input id="admin-confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" disabled></label><p class="note">验证后必须下载并保存新的恢复密钥，才会完成密码重置。旧密钥届时失效，原后台登录会话全部退出。</p></div><button id="admin-access-submit" class="primary">登录并添加此管理设备</button></form><p id="admin-access-error" class="error" role="alert"></p><p><a href="/">返回网络认证</a></p><p class="note">若系统弹出的认证窗口不支持下载，请在系统浏览器打开本页。</p></section></main></div></body></html>
